{% extends "base.html" %}
{% block content %}
<div class="card">
  <h3>Edit Expense</h3>
  <form class="add" method="post">
    <input type="text" name="title" value="{{ e.title }}" required>
    <input type="number" step="0.01" min="0" name="amount" value="{{ e.amount }}" required>
    <select name="category">
      {% for c in ["Food","Travel","Shopping","Bills","Other"] %}
      <option {% if c == e.category %}selected{% endif %}>{{ c }}</option>
      {% endfor %}
    </select>
    <input type="date" name="date" value="{{ e.date }}" required>
    <button type="submit">Save</button>
  </form>
  <p><a href="/">Back</a></p>
</div>
{% endblock %}
